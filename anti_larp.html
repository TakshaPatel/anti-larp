const eliminated = new Set();

function allWords() {
    let result = [];

    for (const category in DECKS) {
        for (const word of DECKS[category]) {
            result.push({
                word,
                category,
                hint: HINTS[word] || "",
                decoy: DECOYS[word] || ""
            });
        }
    }

    return result;
}

function score(item, search) {

    if (!search.trim())
        return Math.floor(Math.random() * 35) + 60;

    const q = search.toLowerCase();

    let score = 0;

    const fields = [
        item.word,
        item.hint,
        item.decoy,
        item.category
    ];

    fields.forEach((field, index) => {

        const value = field.toLowerCase();

        if (value.includes(q)) {
            score += index === 0 ? 100 : 65;
        }

        q.split(/\s+/).forEach(token => {
            if (token.length > 2 && value.includes(token))
                score += 20;
        });
    });

    return Math.min(score, 99);
}

function render() {

    const category = document.getElementById("category").value;
    const search = document.getElementById("search").value;

    let words = allWords();

    if (category !== "ALL") {
        words = words.filter(x => x.category === category);
    }

    words = words
        .map(x => ({
            ...x,
            score: score(x, search)
        }))
        .filter(x => {
            if (!search.trim()) return true;

            const haystack =
                `${x.word} ${x.hint} ${x.decoy} ${x.category}`.toLowerCase();

            return haystack.includes(search.toLowerCase()) ||
                   search.toLowerCase().split(/\s+/).some(
                       token => token.length > 2 && haystack.includes(token)
                   );
        })
        .sort((a,b) => b.score - a.score);

    document.getElementById("count").textContent = words.length;
    document.getElementById("eliminated").textContent = eliminated.size;
    document.getElementById("deckName").textContent = category;

    const results = document.getElementById("results");
    results.innerHTML = "";

    words.forEach(item => {

        const card = document.createElement("div");

        card.className =
            "card " + (eliminated.has(item.word) ? "eliminated" : "");

        card.innerHTML = `
            <div class="tag">${item.category}</div>

            <div class="word">${item.word}</div>

            <div class="detail">
                REAL HINT:
                <span>${item.hint}</span>
            </div>

            <div class="detail">
                DECOY:
                <span>${item.decoy}</span>
            </div>

            <div class="confidence">
                <div style="width:${item.score}%"></div>
            </div>

            <div class="detail">
                MATCH CONFIDENCE:
                <span>${item.score}%</span>
            </div>

            <button onclick="toggleEliminate('${escapeWord(item.word)}')">
                ${eliminated.has(item.word)
                    ? "RESTORE CANDIDATE"
                    : "ELIMINATE"}
            </button>
        `;

        results.appendChild(card);
    });

    updateAnalysis(words, search);
}

function escapeWord(word) {
    return word.replace(/'/g, "\\'");
}

function toggleEliminate(word) {

    if (eliminated.has(word)) {
        eliminated.delete(word);
    } else {
        eliminated.add(word);
    }

    render();
}

function updateAnalysis(words, search) {

    const box = document.getElementById("analysis");

    if (!search.trim()) {
        box.textContent =
            "> Awaiting intelligence input...";
        return;
    }

    if (!words.length) {
        box.innerHTML =
            `<span class="warning">> NO MATCHES. THE IMPOSTER HAS ESCAPED.</span>`;
        return;
    }

    const top = words[0];

    const messages = [
        `> Strongest candidate: ${top.word}`,
        `> Probability model converges on ${top.word}`,
        `> Linguistic evidence favors ${top.word}`,
        `> Cross-referencing clue database... ${top.word} looks suspicious`,
        `> Candidate ${top.word} exhibits anomalously high semantic correlation`
    ];

    box.textContent =
        messages[Math.floor(Math.random() * messages.length)];
}

    .addEventListener("change", render);

document
